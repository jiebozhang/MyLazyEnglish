name: Android

on:
  push:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - ".github/workflows/android.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Use CI-managed JDK
        working-directory: apps/android
        run: if [ -f gradle.properties ]; then sed -i '/^org.gradle.java.home=/d' gradle.properties; fi
      - name: Verify Android project
        working-directory: apps/android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :core:database:assembleDebugAndroidTest :core:testing:test testDebugUnitTest lintDebug
